# Copied Sites are standalone projects and cannot inherit the monorepo policy.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
# Reviewed security patch exceptions, pinned to exact versions; all other packages retain the seven-day rule.
minimumReleaseAgeExclude:
  - better-auth@1.7.15
  - '@better-auth/core@1.7.15'
  - '@better-auth/drizzle-adapter@1.7.15'
  - '@better-auth/kysely-adapter@1.7.15'
  - '@better-auth/memory-adapter@1.7.15'
  - '@better-auth/mongo-adapter@1.7.15'
  - '@better-auth/prisma-adapter@1.7.15'
  - '@better-auth/telemetry@1.7.15'
  - minimatch@11.0.1

trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  workerd: true
storeDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}
cacheDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}/policy-cache
enableGlobalVirtualStore: false
# Reuse store files with clones or hardlinks before falling back to copies.
packageImportMethod: auto
# The explicit installer owns dependency setup, including restored workspaces.
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
overrides:
  "miniflare>sharp": "0.35.5"
  "sharp": "0.35.5"
  "browserslist": "4.28.7"
  "source-map-js": "1.2.2"
  "undici": "7.30.1"
  "ws": "8.21.0"
  "js-yaml@^4.0.0": "4.3.2"
  "@babel/core": "7.29.6"
  "brace-expansion@^1.0.0": "1.1.21"
  "brace-expansion@^5.0.0": "5.0.12"
  "fast-uri": "3.1.9"
  "satori": "0.33.5"
  "image-size@^2.0.0": "2.0.3"
  "baseline-browser-mapping": "2.11.0"
  "fflate@^0.7.0": "0.7.5"
  "esbuild": "0.28.1"
  "minimatch@^10.0.0": "11.0.1"
