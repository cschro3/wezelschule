name: WEZEL NEXT checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: node --test tests/policy.test.mjs tests/design-model.test.mjs
      - run: pnpm run build
      - run: node tests/render-pages.mjs
      - run: node tests/integration.mjs
      - run: node tests/persistence.mjs write
      - run: node tests/persistence.mjs read
