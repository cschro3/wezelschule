name: WEZEL local Windows test
on:
  push:
    branches: [phase6-local-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-local:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: First start through the Windows launcher without project dependencies
        run: node tests/local-http.mjs
        env:
          WEZEL_EXPECT_COLD_INSTALL: '1'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: npm run local:build
      - run: npm run local:setup
      - run: npm run local:setup
      - run: npm run local:test
      - run: node scripts/package-local-test.mjs tests/.generated/phase6/WEZEL-NEXT-LOCAL-TEST.zip
      - name: Extract self-contained test package into a clean directory
        shell: pwsh
        run: Expand-Archive -Path tests/.generated/phase6/WEZEL-NEXT-LOCAL-TEST.zip -DestinationPath "${{ runner.temp }}/WEZEL Test Ä"
      - name: First start from the extracted package with spaces and non-ASCII path
        run: node tests/local-http.mjs
        working-directory: ${{ runner.temp }}/WEZEL Test Ä/WEZEL-NEXT
        env:
          WEZEL_EXPECT_COLD_INSTALL: '1'
      - run: pnpm exec tsc --noEmit
        working-directory: ${{ runner.temp }}/WEZEL Test Ä/WEZEL-NEXT
      - run: npm run local:setup
        working-directory: ${{ runner.temp }}/WEZEL Test Ä/WEZEL-NEXT
      - run: npm run local:test
        working-directory: ${{ runner.temp }}/WEZEL Test Ä/WEZEL-NEXT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-local-verification
          path: tests/.generated/phase6/*.json
          retention-days: 7

      - name: Keep verified local test package for download
        uses: actions/upload-artifact@v4
        with:
          name: wezel-next-local-test-package
          path: tests/.generated/phase6/WEZEL-NEXT-LOCAL-TEST.zip
          retention-days: 7
